services:
  mariadb:
    image: mariadb:11
    container_name: family-budget-db
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword
      MARIADB_DATABASE: family_budget
      MARIADB_USER: budget_user
      MARIADB_PASSWORD: budget_password
    ports:
      - "3306:3306"
    volumes:
      # A named volume on the VM's ext4, not the 9p-mounted Windows drive. The
      # datadir (96MB redo log, ibdata1, ibtmp1) was doing every page write as a
      # 64KB 9p round-trip and filling the guest page cache, which is what kept
      # the WSL VM pinned near its memory ceiling.
      - mariadb_data:/var/lib/mysql
      #- ./data/mariadb:/var/lib/mysql
    networks:
      - budget_network
    # Uses ~130MB with the stock 128M InnoDB buffer pool.
    mem_limit: 384m
    healthcheck:
      test: [
        "CMD-SHELL",
        "mariadb-admin ping -h localhost -u root -p$${MARIADB_ROOT_PASSWORD} || exit 1"
      ]
      interval: 2s
      timeout: 3s
      retries: 40
      start_period: 90s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: family-budget-api
    environment:
      DATABASE_URL: mysql+pymysql://budget_user:budget_password@mariadb:3306/family_budget
      PYTHONUNBUFFERED: 1
      DEBUG: 1
      # The source lives on a Windows drive bind-mounted into WSL2, so watchfiles
      # force-polls instead of using inotify (same reason vite.config.ts sets
      # usePolling). Every stat is a 9p round-trip needing a 64KB contiguous
      # kernel buffer; at the 300ms default those allocations fail under memory
      # pressure and the reloader dies, taking the API down with it.
      WATCHFILES_POLL_DELAY_MS: 1000
    ports:
      - "8000:8000"
      - "5678:5678"
    volumes:
      - ./backend:/app
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - budget_network
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8000 || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 30s
    # Headroom over the ~180MB resident baseline for the retrain fit's transient
    # workspace (~268MB peak with ML_MAX_FEATURES capped).
    mem_limit: 640m
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    image: family-budget-web:dev
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: family-budget-web
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - budget_network
    # PID 1 would otherwise be npm, which doesn't reap orphans - screenshot.mjs
    # runs leaked chromium/crashpad zombies into the container.
    init: true
    # A ceiling for the occasional peak, not steady use: the dev server sits at
    # ~105MB, and Chromium (scripts/screenshot.mjs, see CLAUDE.md) takes it to
    # ~700MB. NOT sized for `npm run build` - tsc+rollup over MUI/AG Grid peaks
    # near 1.8GB, and Node sizes its heap from this cgroup limit, so a build in
    # the running container aborts. Build in the image, or raise this first:
    #   docker update --memory 2g --memory-swap 2g family-budget-web
    mem_limit: 1g
    # vite's entry script directly, not `npm run dev` (nor `npx vite`, which is
    # still npm): the wrapper is a second resident node process (~55MB) whose
    # only job is to spawn this one.
    # command: node node_modules/vite/bin/vite.js
    command: npm run dev

networks:
  budget_network:
    driver: bridge

volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      device: ./data/mariadb
      o: bind
